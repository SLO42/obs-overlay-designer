<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Panels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { background: var(--bg-surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-inset); overflow: hidden; }
  .header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface-2); }
  .title { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--fg-primary); }
  .count { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); background: var(--bg-surface-3); padding: 1px 6px; border-radius: 999px; }
  .content { padding: 10px 12px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 12px; color: var(--fg-body); }
  .row.on { background: var(--c-violet-100); color: var(--fg-primary); border-left: 2px solid var(--accent); padding-left: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; }
  .lanechat { background: var(--c-lane-chat); }
  .lanealerts { background: var(--c-lane-alerts); }
  .laneemotes { background: var(--c-lane-emotes); }
  .meta { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="panel">
    <div class="header"><div class="title">Layers</div><div class="count">4</div></div>
    <div class="content">
      <div class="row on"><div class="dot lanealerts"></div>Alerts<span class="meta">z: 3</span></div>
      <div class="row"><div class="dot lanechat"></div>Chat feed<span class="meta">z: 2</span></div>
      <div class="row"><div class="dot laneemotes"></div>Emote wall<span class="meta">z: 1</span></div>
      <div class="row"><div class="dot" style="background:#4a5162"></div>BG · solid<span class="meta">z: 0</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="header"><div class="title">Inputs</div><div class="count">eventsub · ok</div></div>
    <div class="content">
      <div class="row"><div class="dot" style="background:#4ade80"></div>channel.chat.message<span class="meta">48/s</span></div>
      <div class="row"><div class="dot" style="background:#4ade80"></div>channel.subscribe<span class="meta">0/h</span></div>
      <div class="row"><div class="dot" style="background:#f5b95a"></div>channel.raid<span class="meta">slow</span></div>
    </div>
  </div>
</body></html>
