<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Display font</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .display { font-family: var(--font-display); font-weight: 700; font-size: 68px; line-height: 0.95; color: var(--fg-primary); }
  .display .accent { color: var(--accent); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-family: var(--font-display-sketch); font-size: 26px; color: var(--fg-secondary); margin-top: 4px; }
</style></head>
<body>
  <div class="display">paint the <span class="accent">stream.</span></div>
  <div class="sub">KG Second Chances · Solid + Sketch · brand moments only</div>
  <div class="meta">display · empty states · wordmark · 3d scene titles</div>
</body></html>
