<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; font-family: var(--font-mono); color: var(--fg-body); font-size: 12px; line-height: 1.5; }
  .block { background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .k { color: var(--fg-muted); }
  .v { color: var(--fg-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .u { color: var(--accent); }
  .kbd { font-family: var(--font-mono); font-size: 10px; padding: 2px 5px; border-radius: 3px; background: var(--bg-surface-3); border: 1px solid var(--border-default); border-bottom-width: 2px; color: var(--fg-secondary); }
  .caption { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
</style></head>
<body>
  <div class="caption">JetBrains Mono · readouts · tabular nums on</div>
  <div class="block"><span class="k">canvas</span><span class="v">1920 × 1080 @ 60fps</span><span class="u">live</span></div>
  <div class="block"><span class="k">accent</span><span class="v">#8B5CF6</span><span class="kbd">⌘K</span></div>
  <div class="block"><span class="k">eventsub</span><span class="v">24 ms · 0 dropped</span><span class="u">ok</span></div>
</body></html>
