<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; display: flex; gap: 16px; align-items: center; }
  .box { width: 90px; height: 90px; background: var(--bg-surface-3); border: 1px solid var(--border-default); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .box .name { font-family: var(--font-sans); font-size: 12px; color: var(--fg-primary); font-weight: 600; }
  .box .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  .sm { border-radius: 3px; }
  .md { border-radius: 6px; }
  .lg { border-radius: 10px; }
  .xl { border-radius: 16px; }
  .full { border-radius: 999px; background: var(--accent); color: white; border-color: var(--accent-hover); }
  .full .val, .full .name { color: white; }
</style></head>
<body>
  <div class="box sm"><div class="name">sm</div><div class="val">3px</div></div>
  <div class="box md"><div class="name">md</div><div class="val">6px</div></div>
  <div class="box lg"><div class="name">lg</div><div class="val">10px</div></div>
  <div class="box xl"><div class="name">xl</div><div class="val">16px</div></div>
  <div class="box full"><div class="name">full</div><div class="val">999px</div></div>
</body></html>
