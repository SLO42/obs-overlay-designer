<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge { height: 20px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; border-radius: 999px; border: 1px solid; }
  .b-live { background: rgba(239,75,107,0.15); color: #ff6b8a; border-color: rgba(239,75,107,0.4); }
  .b-ok { background: rgba(47,179,122,0.15); color: #4ade80; border-color: rgba(47,179,122,0.4); }
  .b-warn { background: rgba(230,162,60,0.15); color: #f5b95a; border-color: rgba(230,162,60,0.4); }
  .b-info { background: rgba(77,163,255,0.12); color: #7ebcff; border-color: rgba(77,163,255,0.4); }
  .b-violet { background: rgba(139,92,246,0.15); color: #a78bfa; border-color: rgba(139,92,246,0.4); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .chip { height: 24px; padding: 0 8px 0 4px; background: var(--bg-surface-3); border: 1px solid var(--border-default); border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-sans); font-size: 11px; color: var(--fg-body); }
  .chip .sw { width: 14px; height: 14px; border-radius: 2px; background: #8b5cf6; }
  .chip .x { color: var(--fg-muted); cursor: pointer; margin-left: 2px; font-size: 14px; }
</style></head>
<body>
  <div class="row">
    <span class="badge b-live"><span class="dot pulse"></span>LIVE</span>
    <span class="badge b-ok"><span class="dot"></span>EVENTSUB OK</span>
    <span class="badge b-warn"><span class="dot"></span>DRIFT 240MS</span>
    <span class="badge b-info"><span class="dot"></span>3 LISTENERS</span>
    <span class="badge b-violet">BETA</span>
  </div>
  <div class="row">
    <span class="chip"><span class="sw"></span>#8B5CF6<span class="x">×</span></span>
    <span class="chip"><span class="sw" style="background:#4ade80"></span>chat<span class="x">×</span></span>
    <span class="chip"><span class="sw" style="background:#ff6b8a"></span>alerts<span class="x">×</span></span>
    <span class="chip"><span class="sw" style="background:#f5b95a"></span>emotes<span class="x">×</span></span>
  </div>
</body></html>
