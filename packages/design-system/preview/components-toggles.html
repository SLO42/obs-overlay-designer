<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Toggles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-sans); color: var(--fg-body); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .label { flex: 1; }
  /* Switch */
  .switch { width: 32px; height: 18px; background: var(--bg-surface-3); border: 1px solid var(--border-default); border-radius: 999px; position: relative; cursor: pointer; }
  .switch::after { content:''; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 999px; background: var(--fg-secondary); transition: all var(--dur-base) var(--ease-out); }
  .switch.on { background: var(--accent); border-color: var(--accent-hover); }
  .switch.on::after { left: 15px; background: white; }
  /* Checkbox */
  .check { width: 16px; height: 16px; border: 1px solid var(--border-default); border-radius: 3px; background: var(--bg-surface-2); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; }
  .check.on { background: var(--accent); border-color: var(--accent-hover); }
  /* Radio */
  .radio-grp { display: flex; gap: 0; border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-surface-2); }
  .seg { padding: 5px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); border-right: 1px solid var(--border-default); cursor: pointer; }
  .seg:last-child { border-right: none; }
  .seg.on { background: var(--accent); color: white; }
</style></head>
<body>
  <div class="row"><span class="label">Auto-reconnect EventSub</span><div class="switch on"></div></div>
  <div class="row"><span class="label">Dim overlay on idle</span><div class="switch"></div></div>
  <div class="row"><div class="check on">✓</div><span class="label">Show badges</span></div>
  <div class="row"><div class="check"></div><span class="label">Hide banned users</span></div>
  <div class="row"><span class="label">Align</span>
    <div class="radio-grp"><div class="seg">Left</div><div class="seg on">Center</div><div class="seg">Right</div></div>
  </div>
</body></html>
