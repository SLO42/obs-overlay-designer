<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; }
  .row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 1/1.2; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; font-family: var(--font-mono); font-size: 9px; line-height: 1.2; }
  .k { opacity: 0.7; }
  .v { font-weight: 500; }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background:#07080b;color:#e6e8ef"><span class="k">0</span><span class="v">07080b</span></div>
    <div class="swatch" style="background:#0b0d12;color:#e6e8ef"><span class="k">50</span><span class="v">0b0d12</span></div>
    <div class="swatch" style="background:#11141b;color:#e6e8ef"><span class="k">100</span><span class="v">11141b</span></div>
    <div class="swatch" style="background:#161a23;color:#e6e8ef"><span class="k">150</span><span class="v">161a23</span></div>
    <div class="swatch" style="background:#1a1e27;color:#e6e8ef"><span class="k">200</span><span class="v">1a1e27</span></div>
    <div class="swatch" style="background:#242934;color:#e6e8ef"><span class="k">300</span><span class="v">242934</span></div>
    <div class="swatch" style="background:#333845;color:#e6e8ef"><span class="k">400</span><span class="v">333845</span></div>
    <div class="swatch" style="background:#4a5162;color:#e6e8ef"><span class="k">500</span><span class="v">4a5162</span></div>
    <div class="swatch" style="background:#9399ac;color:#0b0d12"><span class="k">700</span><span class="v">9399ac</span></div>
    <div class="swatch" style="background:#c6cad6;color:#0b0d12"><span class="k">800</span><span class="v">c6cad6</span></div>
    <div class="swatch" style="background:#e6e8ef;color:#0b0d12"><span class="k">900</span><span class="v">e6e8ef</span></div>
  </div>
</body></html>
