<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { font-family: var(--font-sans); font-size: 13px; font-weight: 500; height: 30px; padding: 0 12px; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast); }
  .primary { background: var(--accent); color: white; border: 1px solid var(--accent-hover); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
  .primary:hover { background: var(--accent-hover); }
  .secondary { background: var(--bg-surface-3); color: var(--fg-primary); border: 1px solid var(--border-default); }
  .secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .ghost { background: transparent; color: var(--fg-body); border: 1px solid transparent; }
  .ghost:hover { background: var(--bg-surface-3); }
  .danger { background: transparent; color: var(--c-danger-400); border: 1px solid var(--c-danger-500); }
  .danger:hover { background: var(--c-danger-bg); }
  .icon { width: 30px; padding: 0; justify-content: center; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; min-width: 80px; }
  .kbd { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); margin-left: 4px; }
</style></head>
<body>
  <div class="row"><span class="label">primary</span>
    <button class="primary">Deploy overlay<span class="kbd">⌘↵</span></button>
    <button class="primary">Add widget</button>
  </div>
  <div class="row"><span class="label">secondary</span>
    <button class="secondary">Preview</button>
    <button class="secondary">Cancel</button>
    <button class="secondary icon">⚙</button>
  </div>
  <div class="row"><span class="label">ghost</span>
    <button class="ghost">Reset</button>
    <button class="ghost icon">×</button>
  </div>
  <div class="row"><span class="label">danger</span>
    <button class="danger">Disconnect</button>
  </div>
</body></html>
